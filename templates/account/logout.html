{% extends "allauth/layouts/entrance.html" %}

{% load allauth %}

{% block head_title %}Sign Out{% endblock head_title %}

{% block content %}
    <div class="inner-container">

        <h1>Sign Out</h1>

        <p class="auth-sub">Are you sure you want to sign out?</p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {{ redirect_field }}

            <div class="form-lower-section">
                <button id="submit-button" type="submit">Sign Out</button>
                <a href="{% url 'home' %}" id="cancel-button">Cancel</a>
            </div>
        </form>

    </div>
{% endblock %}
