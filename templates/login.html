{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Issue Mapper - Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#0f172a);
        }

        .container{
            width:100%;
            max-width:420px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .logo{
            text-align:center;
            margin-bottom:30px;
        }

        .logo h1{
            color:#2563eb;
            margin-bottom:5px;
        }

        .logo p{
            color:#64748b;
            font-size:14px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
            color:#334155;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            outline:none;
            transition:.3s;
        }

        input:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,.1);
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
        }

        .btn-login{
            background:#2563eb;
            color:white;
            margin-top:10px;
        }

        .btn-login:hover{
            background:#1d4ed8;
        }

        .divider{
            text-align:center;
            margin:20px 0;
            color:#64748b;
            position:relative;
        }

        .divider::before,
        .divider::after{
            content:'';
            position:absolute;
            top:50%;
            width:40%;
            height:1px;
            background:#cbd5e1;
        }

        .divider::before{
            left:0;
        }

        .divider::after{
            right:0;
        }

        .google-btn{
            display:block;
            width:100%;
            text-align:center;
            padding:12px;
            background:#fff;
            border:1px solid #d1d5db;
            border-radius:8px;
            text-decoration:none;
            color:#111827;
            font-weight:600;
            transition:.3s;
        }

        .google-btn:hover{
            background:#f8fafc;
        }

        .signup{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .signup a{
            color:#2563eb;
            text-decoration:none;
        }

        .messages{
            margin-bottom:15px;
        }

        .message{
            background:#fee2e2;
            color:#b91c1c;
            padding:10px;
            border-radius:8px;
            margin-bottom:10px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>Community Issue Mapper</h1>
        <p>Sign in to continue</p>
    </div>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="btn btn-login">
            Login
        </button>
    </form>

    <div class="divider">
        OR
    </div>

    <a href="/accounts/google/login/" class="google-btn">
        Continue with Google
    </a>

    <div class="signup">
        Don't have an account?
        <a href="#">Register</a>
    </div>

</div>

</body>
</html>
